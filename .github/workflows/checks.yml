name: Deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_DATABASE: caseledger_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-disposable-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r backend/requirements-test.txt
      - run: python scripts/test_deployment.py
        env:
          RUN_MYSQL_INTEGRATION: "true"
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: caseledger_test
          DB_USER: root
          DB_PASSWORD: ci-disposable-password
          AUTH_DEMO_PASSWORD: ci-demo-password-only
      - run: docker build -t caseledger-check .
