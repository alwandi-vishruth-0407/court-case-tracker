<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="600" viewBox="0 0 1070 600" role="img" aria-label="Court case conceptual ER diagram"><rect width="1070" height="600" rx="16" fill="#fbfaf7"/><text x="42" y="48" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1b3444">Conceptual ER diagram</text><text x="42" y="72" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#647982">Five core entities. Appeals use a recursive CASE relationship.</text><path d="M272 217 H415" fill="none" stroke="#9baeb2" stroke-width="2"/><rect x="304" y="189" width="89" height="24" rx="5" fill="#fbfaf7"/><text x="310" y="207" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8c6349">1 assigns N</text><path d="M655 217 H798" fill="none" stroke="#9baeb2" stroke-width="2"/><rect x="678" y="189" width="61" height="24" rx="5" fill="#fbfaf7"/><text x="684" y="207" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8c6349">1 has N</text><path d="M655 282 H798 V405" fill="none" stroke="#9baeb2" stroke-width="2"/><rect x="674" y="325" width="82" height="24" rx="5" fill="#fbfaf7"/><text x="680" y="343" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8c6349">1 has 0..1</text><path d="M535 310 V423 H272" fill="none" stroke="#9baeb2" stroke-width="2"/><rect x="359" y="391" width="96" height="24" rx="5" fill="#fbfaf7"/><text x="365" y="409" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8c6349">M involves N</text><path d="M152 176 V105 H918 V176" fill="none" stroke="#9baeb2" stroke-width="2"/><rect x="644" y="79" width="96" height="24" rx="5" fill="#fbfaf7"/><text x="650" y="97" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8c6349">1 conducts N</text><path d="M480 176 V130 H590 V176" fill="none" stroke="#9baeb2" stroke-width="2"/><rect x="466" y="102" width="152" height="24" rx="5" fill="#fbfaf7"/><text x="472" y="120" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8c6349">CASE 1 appealed by N</text><rect x="42" y="176" width="230" height="106" rx="12" fill="#eaf1f2" stroke="#d6dfe0" stroke-width="1.5"/><text x="60" y="210" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b3444">JUDGE</text><text x="60" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#647982">Judge assigned to case</text><rect x="415" y="176" width="240" height="134" rx="12" fill="#e9f2ed" stroke="#d6dfe0" stroke-width="1.5"/><text x="433" y="210" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b3444">CASE</text><text x="433" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#647982">Original case or appeal</text><rect x="798" y="176" width="230" height="106" rx="12" fill="#eaf1f2" stroke="#d6dfe0" stroke-width="1.5"/><text x="816" y="210" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b3444">HEARING</text><text x="816" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#647982">Dated case event</text><rect x="42" y="423" width="230" height="106" rx="12" fill="#eaf1f2" stroke="#d6dfe0" stroke-width="1.5"/><text x="60" y="457" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b3444">PARTY</text><text x="60" y="482" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#647982">Person or organization</text><rect x="798" y="405" width="230" height="106" rx="12" fill="#eaf1f2" stroke="#d6dfe0" stroke-width="1.5"/><text x="816" y="439" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b3444">JUDGMENT</text><text x="816" y="464" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#647982">Decision for one case</text><text x="414" y="351" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#8c6349">Party role belongs to this relationship.</text><text x="42" y="573" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#647982">Cardinality: 1 = one, N = many, M = many. A case may have no judgment or appeal.</text></svg>